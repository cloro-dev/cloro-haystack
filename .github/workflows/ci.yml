# Runs the tests on each pull request and on each push to main.
# Branch protection on main requires the "test" checks of this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Python that requires-python allows.
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      # "mypy src" finds each module two times, because the haystack_integrations
      # namespace package has no __init__.py. Check the package by its name.
      - name: Type-check
        run: uv run mypy -p haystack_integrations.components.websearch.cloro
        env:
          MYPYPATH: src
      - name: Build the package
        run: uv build
